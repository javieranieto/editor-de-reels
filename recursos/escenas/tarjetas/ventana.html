<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- VENTANA de los reels (estilo aprobado el 22-sep, aquí con el acabado nuevo del banco, 14-oct-2026): el fondo de la
marca cubre el cuadro con un HUECO redondeado abajo donde el video se reduce y él sigue hablando; la gráfica vive arriba.
Corte seco al entrar y salir (así se aprobó). Vertical 1080x1920. Capturar con --alfa --vertical.
T = {
  marca: id de recursos/marcas/ (por defecto "ejemplo"),  t_in, t_out,
  ven: [40, 840, 1040, 1620]   el hueco (x0, y0, x1, y1) — armar_reels.py encaja el video ahí
  etiqueta, titulo (puede llevar \n), filas: [{txt, t, ico: "num"|"bien"|"mal"|""}], pie: {txt, t}
  grande: {txt, t}   (opcional) una frase grande que reemplaza a la lista en su tiempo
  icono: {nombre, t, loop}   (opcional) ícono animado arriba a la derecha de la franja
}
Todo lo que se escribe tiene que caber ARRIBA del hueco: si se pasa, la escena lo marca en rojo en la hoja. -->
<link rel="stylesheet" href="../base/base.css">
<style>
  #fondo{position:absolute;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 22%,var(--fondo1) 0%,var(--fondo2) 55%,var(--fondo3) 100%)}
  #brillo{position:absolute;width:900px;height:700px;border-radius:50%;filter:blur(50px);
          background:radial-gradient(circle,color-mix(in srgb,var(--acento) 16%,transparent),transparent 65%)}
  #marco{position:absolute;border-radius:30px;box-shadow:0 0 0 2px rgba(255,255,255,.10),0 30px 80px rgba(0,0,0,.6)}
  #fi{position:absolute;left:80px;top:88px;font:500 26px var(--mono);color:var(--tenue);letter-spacing:.06em}
  #arriba{position:absolute;left:80px;right:70px;top:150px}
  #et{margin-bottom:22px;font-size:30px}
  #ti{font:700 76px/1.1 var(--titulos);margin-bottom:18px;white-space:pre-line}
  .fila{display:flex;align-items:center;gap:24px;height:96px;font:600 50px var(--cuerpo);white-space:nowrap}
  .ico{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center}
  .num{border-radius:50%;background:var(--acento);color:#fff;font:700 34px var(--titulos)}
  .fila.f-mal .tx{color:var(--tenue);text-decoration:line-through;text-decoration-thickness:4px}
  #pie{font:700 58px/1.1 var(--titulos);color:var(--acento);margin-top:16px;white-space:pre-line}
  #grande{position:absolute;left:80px;right:70px;font:700 96px/1.08 var(--titulos);white-space:pre-line}
  .pasado{outline:4px solid red}
</style></head><body class="alfa">
<div id="capa"><div id="fondo"></div><div id="brillo"></div>
  <div id="fi"></div><div id="arriba"><div id="et" class="etiqueta"></div><div id="ti"></div><div id="filas"></div><div id="pie"></div></div><div id="grande"></div><div id="icono" style="position:absolute;right:70px;top:130px;width:170px;height:170px"></div></div>
<div id="marco"></div>
<script src="../base/base.js"></script><script src="../base/lottie.min.js"></script><script src="../iconos/iconos.js"></script><script src="../iconos/en_escena.js"></script>
<script>
const DEFAULT = {marca:"ejemplo", t_in:0.0, t_out:6.0, ven:[40,840,1040,1620], etiqueta:"Pregúntate", titulo:"¿Cuánto tardas\nen contestar?",
  filas:[{txt:"En promedio.", t:1.2, ico:""}], pie:{txt:"Más de lo que crees.", t:2.4}, grande:null};
const SVG = {
  bien: c => `<svg viewBox="0 0 48 48" width="64" height="64"><circle cx="24" cy="24" r="22" fill="${c}" opacity=".18"/><path d="M13 25l7 7 15-16" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  mal:  c => `<svg viewBox="0 0 48 48" width="64" height="64"><circle cx="24" cy="24" r="22" fill="${c}" opacity=".14"/><path d="M16 16l16 16M32 16L16 32" stroke="${c}" stroke-width="5" stroke-linecap="round"/></svg>`};
function hueco(W, H, v, r){
  const [x0,y0,x1,y1] = v;
  const d = `M0 0H${W}V${H}H0Z M${x0+r} ${y0}H${x1-r}A${r} ${r} 0 0 1 ${x1} ${y0+r}V${y1-r}A${r} ${r} 0 0 1 ${x1-r} ${y1}H${x0+r}A${r} ${r} 0 0 1 ${x0} ${y1-r}V${y0+r}A${r} ${r} 0 0 1 ${x0+r} ${y0}Z`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'><path fill-rule='evenodd' d='${d}'/></svg>`)}")`;
}
function render(t, T){
  T = Object.assign({}, DEFAULT, T); marca(T);
  const W = innerWidth, H = innerHeight, v = T.ven, css = getComputedStyle(document.body);
  const dentro = t >= T.t_in && t < T.t_out;                       // corte seco, como se aprobó
  const capa = $('capa'); capa.style.display = dentro ? 'block' : 'none'; $('marco').style.display = dentro ? 'block' : 'none';
  if (!dentro) return;
  const m = hueco(W, H, v, 30); capa.style.cssText = `position:absolute;inset:0;-webkit-mask:${m};mask:${m}`;
  Object.assign($('marco').style, {left: v[0]+'px', top: v[1]+'px', width: (v[2]-v[0])+'px', height: (v[3]-v[1])+'px'});
  $('brillo').style.left = (W*0.1 + 120*Math.sin(t*0.6)) + 'px'; $('brillo').style.top = (40 + 60*Math.cos(t*0.5)) + 'px';
  pintaIcono($('icono'), t, T.icono, T.marca);
  $('fi').textContent =firmaMarca(T);
  const k0 = prog(t, T.t_in, 0.3);
  $('et').textContent = T.etiqueta || ''; $('et').style.opacity = k0;
  const ti = $('ti'); ti.textContent = T.titulo || ''; ti.style.display = T.titulo ? 'block' : 'none';
  const kt = prog(t, T.t_in + 0.1, 0.35); ti.style.opacity = kt; ti.style.transform = `translateY(${24*(1-kt)}px)`;
  const g = T.grande && t >= T.grande.t - 0.15;                   // la frase grande reemplaza a la lista
  $('arriba').style.opacity = g ? 1 - prog(t, T.grande.t - 0.15, 0.25) : 1;
  const acento = css.getPropertyValue('--acento').trim(), tenue = css.getPropertyValue('--tenue').trim();
  let html = '';
  (T.filas || []).forEach((f, k) => {
    const e = prog(t, f.t - 0.12, 0.32); if (e <= 0) return;
    const r = resorte(t, f.t - 0.12, 0.45), ico = f.ico || '';
    let icon = '';
    if (ico === 'num') icon = `<div class="ico num" style="transform:scale(${0.4+0.6*r})">${k+1}</div>`;
    else if (ico) icon = `<div class="ico" style="transform:scale(${0.4+0.6*r})">${SVG[ico](ico==='bien'?acento:tenue)}</div>`;
    html += `<div class="fila f-${ico}" style="opacity:${e};transform:translateX(${30*(1-e)}px)">${icon}<span class="tx">${f.txt}</span></div>`;
  });
  $('filas').innerHTML = html;
  const p = $('pie'); if (T.pie){ p.textContent = T.pie.txt; const e = prog(t, T.pie.t - 0.12, 0.32); p.style.opacity = e; p.style.transform = `translateY(${16*(1-e)}px)`; } else p.textContent = '';
  const gr = $('grande');
  if (g){ gr.textContent = T.grande.txt; const r = resorte(t, T.grande.t - 0.1, 0.45); gr.style.top = '200px';
          gr.style.opacity = prog(t, T.grande.t - 0.1, 0.25); gr.style.transform = `scale(${1.3 - 0.3*Math.min(1,r)})`; gr.style.transformOrigin = 'left center';
          gr.style.color = acento; } else gr.textContent = '';
  // guardia: lo de arriba no puede bajar al hueco
  const fondoArriba = $('arriba').getBoundingClientRect().bottom;
  $('arriba').classList.toggle('pasado', fondoArriba > v[1] - 30);
}
</script></body></html>
